name: CI

# Provides the required `test` status check for changes outside the Rust
# crates. `rust.yml` already defines a `test` job, but it is path-filtered to
# `crates/**`, so a PR touching only the JS/TS packages produces no `test`
# check and branch protection blocks the merge. This workflow runs the
# library test suites and reports the same `test` context for those PRs.
#
# It mirrors the build sequence in `publish.yml`: the pnpm workspace resolves
# against `crates/harmoni-wasm/pkg`, so the wasm package must be built before
# `pnpm install`, and the icons are regenerated before their tests run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build harmoni-wasm
        run: wasm-pack build crates/harmoni-wasm --target web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm --filter @primitiv-ui/icons generate

      - name: Test libraries
        run: pnpm -r --filter "@primitiv-ui/react" --filter "@primitiv-ui/icons" --filter "@primitiv-ui/tokens" qa:units

      # Reporting only (README coverage badges) — not a gate. The vitest
      # thresholds above already fail the build on any coverage regression.
      # One step per package so each carries its own Codecov flag.
      - name: Upload react coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/react/coverage/lcov.info
          flags: react
          fail_ci_if_error: false

      - name: Upload icons coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/icons/coverage/lcov.info
          flags: icons
          fail_ci_if_error: false

      - name: Upload tokens coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/tokens/coverage/lcov.info
          flags: tokens
          fail_ci_if_error: false

      # Type-check the library sources AND their tests. vitest runs through
      # esbuild, which strips types without checking them, so a type error in a
      # component or its test otherwise slips through the suite. The tokens
      # package already self-checks via its own `lint` script.
      - name: Type-check libraries
        run: |
          pnpm --filter @primitiv-ui/react typecheck
          pnpm --filter @primitiv-ui/icons typecheck
          pnpm --filter @primitiv-ui/tokens lint

      # Guard the §1.16/§1.21 pattern: a custom prop narrowing a same-named
      # native attribute without Omit-ting it first resolves to an intersection
      # artifact (e.g. `string | (readonly string[] & string)`) that TS accepts
      # with no compile error. Fails on any such artifact across the headless
      # package's exported *Props types.
      - name: Check headless prop-type hygiene
        run: pnpm qa:prop-collisions

      - name: Type-check registry wrappers
        run: pnpm qa:registry-types

      # Registry stylesheets are copied verbatim into consumer repos and nothing
      # parses them, so a comment that closes early — a `body/<star>/prop` glob is
      # the classic — silently dumps prose into the rule and the browser drops the
      # whole thing. Caught once by hand on `figure`; guarded from here.
      - name: Check registry stylesheets parse
        run: pnpm qa:stylesheets

      # Type-check and build the workbench (tsc -b && vite build). The doc-site
      # deploy (deploy-docs.yml) is manual-only, so without this a broken
      # workbench build — a type error in an example page or the OKLCH picker —
      # only surfaces at deploy time, not on the PR.
      - name: Build workbench
        run: pnpm --filter workbench build
