name: Deploy docs site

# Manual only — never publishes on push. Trigger from the GitHub UI
# (Actions → "Deploy docs site" → Run workflow) or by asking Claude to run it.
#
# Publishes the Next.js docs site (apps/docs-site) as the main GitHub Pages site
# at primitiv-ui.github.io/primitiv/, with the kitchen-sink kept at
# /primitiv/kitchen-sink/ for phone QA. (Replaces the old VitePress deploy.)
on:
  workflow_dispatch:

# One concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Both apps/docs-site and apps/kitchen-sink are EXCLUDED from the pnpm
      # workspace (pnpm-workspace.yaml) — they are standalone consumers with
      # their own lockfiles, so each installs with --ignore-workspace and there
      # is no root install (and no wasm) to do. @primitiv-ui/react is a `link:`
      # to packages/react's SOURCE (zero runtime deps, transpiled by Next), so
      # the build exercises the current branch's headless code; @primitiv-ui/icons
      # is the published package.
      - name: Install docs-site dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
        working-directory: apps/docs-site

      # Static export under the /primitiv/ sub-path (GitHub Pages project site).
      # DOCS_SITE_BASE_PATH drives next.config's basePath + assetPrefix;
      # `output: "export"` lands the result in apps/docs-site/out.
      - name: Build docs site
        env:
          DOCS_SITE_BASE_PATH: /primitiv
        run: pnpm build
        working-directory: apps/docs-site

      # The kitchen-sink is kept at /primitiv/kitchen-sink/ for phone QA. Its
      # Vite/tsconfig dev-alias @primitiv-ui/react + /icons to the workspace
      # SOURCE, so this exercises the current branch too. Run `vite build`
      # directly (not the package's `tsc -b && vite build`): the aliased source
      # is outside the composite tsconfig's include (TS6307), and the real type
      # gates run on packages/react anyway.
      - name: Install kitchen-sink dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
        working-directory: apps/kitchen-sink

      - name: Build kitchen-sink
        env:
          KITCHEN_SINK_BASE: /primitiv/kitchen-sink/
        run: pnpm exec vite build
        working-directory: apps/kitchen-sink

      # Assemble: the docs site is the root; the kitchen-sink is a sub-path (its
      # own SPA / HTML document, so no CSS interaction with the docs site).
      # .nojekyll is REQUIRED — Next emits a `_next/` dir, and GitHub Pages'
      # Jekyll would otherwise drop every underscore-prefixed path.
      - name: Assemble site
        run: |
          cp -r apps/kitchen-sink/dist apps/docs-site/out/kitchen-sink
          touch apps/docs-site/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
