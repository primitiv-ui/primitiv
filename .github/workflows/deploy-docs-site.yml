name: Deploy docs site

# Manual only — never publishes on push. Trigger from the GitHub UI
# (Actions → "Deploy docs site" → Run workflow) or by asking Claude to run it.
#
# Publishes the Next.js docs site (apps/docs-site) as the main GitHub Pages site
# at the primitiv-ui.dev custom domain root (via apps/docs-site/public/CNAME).
# (Replaces the old VitePress deploy.)
on:
  workflow_dispatch:

# One concurrent Pages deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # apps/docs-site is EXCLUDED from the pnpm workspace (pnpm-workspace.yaml):
      # a standalone consumer with its own lockfile, installed with
      # --ignore-workspace. @primitiv-ui/react is a `link:` to packages/react's
      # SOURCE (transpiled by Next), so the build exercises the current branch's
      # headless code; @primitiv-ui/icons is the published package.
      # @primitiv-ui/react imports @primitiv-ui/web and @primitiv-ui/core (RFC
      # 0033). The docs site compiles react from its source, and those imports
      # resolve from packages/react's own node_modules, so install react and what
      # it depends on from the workspace (filtered, which leaves out the
      # workbench and its wasm dependency).
      - name: Install @primitiv-ui/react and its workspace dependencies
        run: pnpm install --frozen-lockfile --filter "@primitiv-ui/react..."

      - name: Install docs-site dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
        working-directory: apps/docs-site

      # Static export at the domain root — primitiv-ui.dev is a custom domain
      # on this project's GitHub Pages site (apps/docs-site/public/CNAME pins
      # it), so DOCS_SITE_BASE_PATH is left unset and next.config's
      # basePath/assetPrefix stay off, same as local dev. `output: "export"`
      # lands the result in apps/docs-site/out.
      - name: Build docs site
        run: pnpm build
        working-directory: apps/docs-site

      # Reads the export a crawler will fetch: sitemap and robots, a canonical
      # and Open Graph tags on every page. A failure here stops the deploy.
      - name: Check search metadata
        run: pnpm test:seo
        working-directory: apps/docs-site

      # .nojekyll is REQUIRED — Next emits a `_next/` dir, and GitHub Pages'
      # Jekyll would otherwise drop every underscore-prefixed path. CNAME (from
      # apps/docs-site/public/) rides along in `out/` automatically since it's
      # a public asset, which is what keeps the custom domain pinned across
      # every redeploy.
      - name: Assemble site
        run: touch apps/docs-site/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
