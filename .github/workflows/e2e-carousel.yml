name: E2E — Carousel loop

# Real-browser Playwright coverage for the Carousel infinite loop, run against
# the docs site's Carousel page ("Infinite loop" and "Linked slides"). The docs
# site links @primitiv-ui/react to the workspace source, so a build exercises
# the CURRENT branch's headless code. Running it in CI is what adds WebKit: iOS
# Safari's engine core, the one engine with a real chance of surfacing the
# iOS-only scroll quirks a plain Chromium hides.
#
# NOTE: no engine simulates real touch momentum, so fling distance stays a
# real-device check; this gates the deterministic behaviour (a wrap always
# settles on a real slide, never a clone).
#
# Also runs elements-preview.spec.ts: Elements-mode previews must be the real
# @primitiv-ui/web custom elements, so that suite gates the web package too.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/react/src/Carousel/**"
      - "apps/docs-site/src/components/carousel*"
      - "apps/docs-site/src/styles/primitiv/carousel/**"
      - "apps/docs-site/src/site/examples/carousel.tsx"
      - "packages/web/src/**"
      - "packages/core/src/**"
      - "apps/docs-site/src/site/ElementsPreview.tsx"
      - "apps/docs-site/src/site/InteractiveExample.tsx"
      - "apps/docs-site/src/site/Playground.tsx"
      - "apps/docs-site/src/site/examples/tabs.tsx"
      - "apps/docs-site/src/site/examples/button.tsx"
      - "apps/docs-site/e2e/**"
      - "apps/docs-site/playwright.config.ts"
      - "apps/docs-site/next.config.ts"
      - "apps/docs-site/package.json"
      - ".github/workflows/e2e-carousel.yml"

# One run per ref; a new push cancels an in-flight run.
concurrency:
  group: e2e-carousel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # @primitiv-ui/react imports @primitiv-ui/web and @primitiv-ui/core (RFC
      # 0033). The docs site compiles react from its source, and those imports
      # resolve from packages/react's own node_modules, so install react and what
      # it depends on from the workspace (filtered, which leaves out the
      # workbench and its wasm dependency).
      - name: Install @primitiv-ui/react and its workspace dependencies
        run: pnpm install --frozen-lockfile --filter "@primitiv-ui/react..."

      # The docs site is excluded from the pnpm workspace (own lockfile), so it
      # installs standalone, as the deploy workflow does. Browsers are installed
      # explicitly below, with the OS packages WebKit needs.
      - name: Install docs-site dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile
        working-directory: apps/docs-site
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build docs site
        run: pnpm build
        working-directory: apps/docs-site

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit chromium
        working-directory: apps/docs-site

      # CI=true is set by Actions, so the config adds the webkit / mobile-safari
      # projects and serves out/ itself.
      - name: Run Carousel e2e
        run: pnpm test:e2e
        working-directory: apps/docs-site

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/docs-site/playwright-report
          retention-days: 14
