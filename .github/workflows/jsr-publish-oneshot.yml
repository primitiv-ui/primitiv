name: Publish to JSR (one-shot bootstrap)

# For when npm published a release and JSR did not finish: re-running
# publish.yml would hit E403 "already published" on npm before reaching JSR.
# Edit the package list to what JSR is missing, then run it from Actions.

on:
  workflow_dispatch:

jobs:
  jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build harmoni-wasm
        run: wasm-pack build crates/harmoni-wasm --target web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm --filter @primitiv-ui/icons generate

      # v0.1.42: npm published everything and JSR stopped after core, on web's
      # unversioned `workspace:*` dependency (now pinned in jsr.json). This
      # publishes the rest to JSR, in dependency order, at the version their
      # jsr.json already carries.
      - name: Publish libraries to JSR
        run: |
          for pkg in packages/web packages/react packages/icons packages/tokens; do
            echo "::group::jsr publish $pkg"
            (cd "$pkg" && npx jsr publish)
            echo "::endgroup::"
          done
