name: Publish packages

# Publishes all primitiv-ui packages in dependency order:
#   1. Builds the `primitiv` Rust binary for each platform in parallel.
#   2. Publishes @primitiv-ui/cli-<target> platform packages.
#   3. Publishes the `primitiv-ui` wrapper and `create-primitiv-ui` scaffold.
#   4. Publishes @primitiv-ui/{react,icons,tokens} libraries to npm and JSR.
#   5. Publishes @primitiv-ui/harmoni-wasm (the wasm-pack build of
#      crates/harmoni-wasm) to npm, public and MIT like the engine crate it
#      wraps — the harmoni Figma plugin (private repo) consumes it as a
#      published dependency, since crates/harmoni-wasm/pkg/ is gitignored and
#      generated, so a git dependency is impossible.
#
# Steps 2–3 must complete before 4 because npm resolves optionalDependencies
# at install time; the platform packages must already exist.
#
# Auth is tokenless via OIDC (no long-lived secrets):
#   - npm  uses Trusted Publishing + provenance (id-token: write).
#   - JSR  uses its built-in GitHub Actions OIDC (id-token: write).
#
# PREREQUISITES — see RELEASING.md.
# For the very first publish of a new package, if Trusted Publishing is not
# yet configured on npmjs.com, uncomment the NODE_AUTH_TOKEN env blocks
# and add an NPM_TOKEN repo secret as a one-time bootstrap, then remove it
# once TP is confirmed.

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # ── 1. Cross-platform Rust binary builds ──────────────────────────────────
  build-cli:
    name: Build CLI / ${{ matrix.npm-target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin,       npm-target: darwin-arm64    }
          - { os: macos-latest,     target: x86_64-apple-darwin,        npm-target: darwin-x64      }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   npm-target: linux-x64-gnu   }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  npm-target: linux-arm64-gnu }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     npm-target: win32-x64       }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p primitiv-cli

      # Stage the binary under a fixed name so the download path is predictable.
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staging
          if [ -f "target/${{ matrix.target }}/release/primitiv.exe" ]; then
            cp "target/${{ matrix.target }}/release/primitiv.exe" staging/primitiv.exe
          else
            cp "target/${{ matrix.target }}/release/primitiv" staging/primitiv
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: cli-${{ matrix.npm-target }}
          path: staging/
          if-no-files-found: error

  # ── 2–4. Place binaries and publish everything ────────────────────────────
  publish:
    name: Publish packages
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing + JSR OIDC
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # No `registry-url`: it makes setup-node write a deprecated
          # `always-auth` key into the runner npmrc (npm warns on it). We
          # publish tokenless via Trusted Publishing to the default
          # registry (npmjs.org), so the generated npmrc isn't needed.

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0

      # Unscoped name ("harmoni-wasm"), matching what pnpm-workspace.yaml and
      # apps/workbench's `"harmoni-wasm": "workspace:*"` expect — this build's
      # sole purpose here is letting `pnpm install` resolve that workspace
      # member; it is not what gets published (see "Publish harmoni-wasm to
      # npm" below, which renames and republishes from the same pkg/ dir).
      - name: Build harmoni-wasm
        run: wasm-pack build crates/harmoni-wasm --target web

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate icons
        run: pnpm --filter @primitiv-ui/icons generate

      - name: Test libraries
        run: pnpm -r --filter "@primitiv-ui/react" --filter "@primitiv-ui/icons" --filter "@primitiv-ui/tokens" qa:units

      # Preflight: validate JSR publishability (slow-types check) for every
      # library BEFORE any npm publish runs. npm versions are immutable, so a
      # JSR-only failure after npm has published leaves the registries skewed
      # (npm ahead of JSR). Running the dry-run first means a slow-types error
      # aborts the whole job with nothing published — both registries always move
      # together. (A bare `Slot` export shipped without an explicit type and broke
      # the JSR step at 0.1.20 exactly this way.)
      - name: Preflight — JSR slow-types check (before any npm publish)
        run: |
          for pkg in packages/react packages/icons packages/tokens; do
            echo "::group::jsr publish --dry-run $pkg"
            (cd "$pkg" && npx jsr publish --dry-run)
            echo "::endgroup::"
          done

      - name: Update npm
        run: npm install -g npm@latest

      # Download all five CLI binaries from the build-cli matrix jobs.
      - name: Download CLI binaries
        uses: actions/download-artifact@v5
        with:
          pattern: cli-*
          path: /tmp/cli-artifacts

      # Copy each binary into its npm platform package directory.
      # The binary is not committed — it only exists at publish time.
      - name: Place CLI binaries in platform packages
        run: |
          install -Dm755 /tmp/cli-artifacts/cli-darwin-arm64/primitiv    npm/cli-darwin-arm64/primitiv
          install -Dm755 /tmp/cli-artifacts/cli-darwin-x64/primitiv      npm/cli-darwin-x64/primitiv
          install -Dm755 /tmp/cli-artifacts/cli-linux-x64-gnu/primitiv   npm/cli-linux-x64-gnu/primitiv
          install -Dm755 /tmp/cli-artifacts/cli-linux-arm64-gnu/primitiv npm/cli-linux-arm64-gnu/primitiv
          cp /tmp/cli-artifacts/cli-win32-x64/primitiv.exe               npm/cli-win32-x64/primitiv.exe

      # Platform packages must land before the wrapper (which lists them as
      # optionalDependencies), so npm can resolve them on install.
      #
      # Guarded by an existence check: npm versions are immutable, and a
      # workflow dispatch always restarts this job from the top, so a retry
      # after a *later* step fails (as happened publishing v0.1.30 — the
      # harmoni-wasm auth bootstrap failed after these had already gone out)
      # would otherwise abort immediately trying to republish an already-live
      # version. Skipping what's already there makes every publish step in
      # this job safe to retry.
      - name: Publish CLI platform packages
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64-gnu cli-linux-arm64-gnu cli-win32-x64; do
            echo "::group::publish @primitiv-ui/$pkg"
            name="@primitiv-ui/$pkg"
            version=$(node -p "require('./npm/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "  $name@$version already published — skipping"
            else
              (cd "npm/$pkg" && npm publish --access public --provenance)
            fi
            echo "::endgroup::"
          done

      - name: Publish CLI wrapper and scaffold
        run: |
          for dir in npm/cli-wrapper npm/create-primitiv-ui; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "  $name@$version already published — skipping"
            else
              (cd "$dir" && npm publish --access public --provenance)
            fi
          done

      # Re-scope the same pkg/ dir `pnpm install` just resolved as unscoped
      # "harmoni-wasm" (comment above) — nothing after this point re-reads
      # pnpm's workspace resolution, so renaming in place is safe. Publishing
      # directly with npm, not `pnpm -r publish`: crates/harmoni-wasm/pkg is a
      # generated build artefact directory, not a source package with its own
      # publishConfig, the same reasoning that has the CLI platform packages
      # above use raw `npm publish` rather than pnpm's recursive publish.
      - name: Publish harmoni-wasm to npm
        run: |
          cd crates/harmoni-wasm/pkg
          npm pkg set name="@primitiv-ui/harmoni-wasm"
          version=$(node -p "require('./package.json').version")
          if npm view "@primitiv-ui/harmoni-wasm@$version" version >/dev/null 2>&1; then
            echo "  @primitiv-ui/harmoni-wasm@$version already published — skipping"
          else
            npm publish --access public --provenance
          fi

      # Filtered to exactly these three by name, not `pnpm -r publish` —
      # `crates/harmoni-wasm/pkg` is also a pnpm workspace member (so
      # apps/workbench can link it) and carries no "private" field once
      # wasm-pack generates its real package.json, so a recursive publish
      # sweeps it up too and fails re-publishing the version the dedicated
      # step just published above (this is what failed v0.1.30's first
      # attempt at this step — the comment this replaced assumed pnpm would
      # skip it, which was never actually true for wasm-pack's output).
      # Existence-guarded per package, same reasoning as the npm steps above.
      - name: Publish libraries to npm
        run: |
          for pkg in react icons tokens; do
            name="@primitiv-ui/$pkg"
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "  $name@$version already published — skipping"
            else
              pnpm --filter "$name" publish --access public --no-git-checks --provenance
            fi
          done

      # JSR authenticates via OIDC automatically inside GitHub Actions.
      - name: Publish libraries to JSR
        run: |
          for pkg in packages/react packages/icons packages/tokens; do
            echo "::group::jsr publish $pkg"
            (cd "$pkg" && npx jsr publish)
            echo "::endgroup::"
          done
