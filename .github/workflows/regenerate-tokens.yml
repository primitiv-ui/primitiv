name: Regenerate tokens

# Re-emits both apps' token layers from the DTCG source
# (packages/tokens/src/*.json) and commits the result.
#
# These are COMMITTED, generated files. No other workflow regenerates them, and
# they can't be emitted without Rust (`primitiv tokens`) — so this is the
# no-local-Rust, one-click way to refresh them after a token change.
#
# `primitiv tokens --out <path>` writes THREE files, not one: the token layer at
# <path>, plus `primitiv-base.css` and `breakpoints.ts` as siblings beside it.
# This workflow used to stage only the token layer, so an edit to the base
# stylesheet regenerated correctly and was then thrown away — it ran green and
# committed nothing, and the committed base sheet silently fell behind (found
# 2026-08-18, along with the workbench's token layer being 424 lines stale).
# Stage every file the command writes, or the ones left out will drift.
#
#   Actions -> "Regenerate tokens" -> Run workflow -> pick a branch -> Run.
#
# The CLI `include_str!`s the DTCG at compile time, so `cargo run` recompiles
# against the current source and emits current tokens — no Node/pnpm needed.
#
# Pushes the commit back to the branch, so it authenticates with RELEASE_TOKEN
# (the maintainer PAT that can bypass branch protection), exactly like
# release.yml — the default GITHUB_TOKEN / github-actions[bot] can't be on the
# `main` bypass list. See RELEASING.md §5.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-tokens-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Regenerate the kitchen-sink token layer
        run: cargo run -q -p primitiv-cli -- tokens --format css --out apps/kitchen-sink/src/styles/primitiv/tokens.css

      - name: Regenerate the workbench token layer
        run: cargo run -q -p primitiv-cli -- tokens --format css --out apps/workbench/src/primitiv-tokens.css

      # Added 2026-08-22. The docs site was scaffolded after the last token
      # change, so it happened to be current — but nothing regenerated it and
      # nothing checked it, which meant the next colour edit would have left the
      # PUBLIC site on stale values, the one surface where that matters most.
      - name: Regenerate the docs-site token layer
        run: cargo run -q -p primitiv-cli -- tokens --format css --out apps/docs-site/src/styles/primitiv/tokens.css

      - name: Commit and push if changed
        run: |
          # Every file the command writes — the token layer plus the two siblings
          # it emits beside each one. Staging a subset is what let the base sheet
          # drift.
          git add \
            apps/kitchen-sink/src/styles/primitiv/tokens.css \
            apps/kitchen-sink/src/styles/primitiv/primitiv-base.css \
            apps/kitchen-sink/src/styles/primitiv/breakpoints.ts \
            apps/workbench/src/primitiv-tokens.css \
            apps/workbench/src/primitiv-base.css \
            apps/workbench/src/breakpoints.ts \
            apps/docs-site/src/styles/primitiv/tokens.css \
            apps/docs-site/src/styles/primitiv/primitiv-base.css \
            apps/docs-site/src/styles/primitiv/breakpoints.ts
          if git diff --cached --quiet; then
            echo "Every generated token file is already up to date — nothing to commit."
          else
            git diff --cached --name-only
            git commit -m "chore: regenerate the committed token layers"
            git push origin HEAD
          fi
