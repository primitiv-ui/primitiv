<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Carousel, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-carousel" hx-get="/fragments/carousel" hx-target="#slot-1">Load carousel</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. An out-of-band slide -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/carousel-oob-slide" hx-swap="none">Add a slide</button>

    <!-- 3. Server re-render on a new page -->
    <section id="rerender-region"></section>
    <button type="button" id="load-page" hx-get="/fragments/carousel-oob-page" hx-swap="none">Show page 3</button>

    <!-- 4. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/carousel-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 5. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/carousel-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 6. hx-trigger on the change event, and a veto on it -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <!-- 7. A carousel nested in a slide -->
    <button type="button" id="load-nested" hx-get="/fragments/carousel-nested" hx-target="#nested-slot">Load nested</button>
    <div id="nested-slot"></div>

    <script type="module" src="/src/carousel-htmx.ts"></script>
  </body>
</html>
