<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Checkbox Card, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-card" hx-get="/fragments/checkbox-card" hx-target="#slot-1">Load card</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A card arriving out of band beside another -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/checkbox-card-oob" hx-swap="none">Add a card</button>

    <!-- 3. Server re-render with a new state -->
    <section id="rerender-region"></section>
    <button type="button" id="load-value" hx-get="/fragments/checkbox-card-oob-value" hx-swap="none">Check it</button>

    <!-- 4. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/checkbox-card-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 5. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/checkbox-card-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 6. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <section id="veto-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/checkbox-card-htmx.ts"></script>
  </body>
</html>
