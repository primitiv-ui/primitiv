<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Code Block, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-block" hx-get="/fragments/code-block" hx-target="#slot-1">Load block</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. The server re-renders the code -->
    <section id="rerender-region"></section>
    <button type="button" id="load-code" hx-get="/fragments/code-block-oob-code" hx-swap="none">Re-render the code</button>

    <!-- 3. A tab panel's code arriving out of band -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/code-block-oob-panel" hx-swap="none">Load pnpm's command</button>

    <!-- 4. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/code-block-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 5. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/code-block-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. Plain code swapped into a highlighting block -->
    <section id="swap-region"></section>
    <button type="button" id="load-plain" hx-get="/fragments/code-block-plain" hx-target="#swapped-code code">Load new code</button>

    <!-- 6. hx-trigger on the copy event -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/code-block-htmx.ts"></script>
  </body>
</html>
