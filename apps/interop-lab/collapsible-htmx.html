<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Collapsible, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-collapsible" hx-get="/fragments/collapsible" hx-target="#slot-1">Load collapsible</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A collapsible swapped into the panel of another -->
    <section id="outer-region"></section>
    <button type="button" id="load-nested" hx-get="/fragments/collapsible-nested" hx-target="#outer-content">Load nested</button>

    <!-- 3. A panel arriving out of band -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/collapsible-oob-panel" hx-swap="none">Add the panel</button>

    <!-- 4. Server re-render, now open -->
    <section id="rerender-region"></section>
    <button type="button" id="load-open" hx-get="/fragments/collapsible-oob-open" hx-swap="none">Open it</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/collapsible-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/collapsible-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. Lazy panel -->
    <section id="lazy-region"></section>

    <!-- 8. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/collapsible-htmx.ts"></script>
  </body>
</html>
