<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Dropdown, HTMX</title>
    <style>
      primitiv-dropdown-content[popover], primitiv-dropdown-sub-content[popover] { margin: 0; inset: auto; padding: 4px; }
      primitiv-dropdown-content[popover] { position-area: bottom span-right; }
      primitiv-dropdown-sub-content[popover] { position-area: right span-bottom; }
    </style>
  </head>
  <body>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-dropdown" hx-get="/fragments/dropdown" hx-target="#slot-1">Load dropdown</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A menu arriving out of band -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/dropdown-oob-content" hx-swap="none">Add the menu</button>

    <!-- 3. Server re-render, now open -->
    <section id="rerender-region"></section>
    <button type="button" id="load-open" hx-get="/fragments/dropdown-oob-open" hx-swap="none">Open it</button>

    <!-- 4. hx-preserve -->
    <div id="preserve-region"></div>

    <!-- 5. Items loaded into an open menu -->
    <section id="lazy-region"></section>

    <!-- 6. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/dropdown-htmx.ts"></script>
  </body>
</html>
