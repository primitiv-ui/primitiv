<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Listbox, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-list" hx-get="/fragments/listbox" hx-target="#slot-1">Load listbox</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. An out-of-band group -->
    <section id="group-region"></section>
    <button type="button" id="load-group" hx-get="/fragments/listbox-oob-group" hx-swap="none">Add a group</button>

    <!-- 3. An out-of-band option -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/listbox-oob-option" hx-swap="none">Add an option</button>

    <!-- 4. Server re-render with a new value -->
    <section id="rerender-region"></section>
    <button type="button" id="load-value" hx-get="/fragments/listbox-oob-value" hx-swap="none">Select carrot</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/listbox-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/listbox-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <!-- 8. Right to left -->
    <button type="button" id="load-rtl" hx-get="/fragments/listbox-rtl" hx-target="#rtl-slot">Load RTL listbox</button>
    <div id="rtl-slot"></div>

    <script type="module" src="/src/listbox-htmx.ts"></script>
  </body>
</html>
