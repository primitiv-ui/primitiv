<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Miller Columns, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-miller" hx-get="/fragments/miller-columns" hx-target="#slot-1">Load strip</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A strip swapped into another's preview panel -->
    <section id="outer-region"></section>
    <button type="button" id="load-nested" hx-get="/fragments/miller-columns-nested" hx-target="#outer-preview">Load nested</button>

    <!-- 3. A column arriving out of band -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/miller-columns-oob-column" hx-swap="none">Add Blog's column</button>

    <!-- 4. Server re-render, on a deeper path -->
    <section id="rerender-region"></section>
    <button type="button" id="load-deeper" hx-get="/fragments/miller-columns-oob-deeper" hx-swap="none">Go deeper</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/miller-columns-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/miller-columns-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. Lazy column -->
    <section id="lazy-region"></section>

    <!-- 8. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/miller-columns-htmx.ts"></script>
  </body>
</html>
