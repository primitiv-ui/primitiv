<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Navigation Menu, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-nav" hx-get="/fragments/navigation-menu" hx-target="#slot-1">Load menu</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A menu swapped into the panel of another -->
    <section id="outer-region"></section>

    <!-- 3. A panel arriving out of band, into the viewport -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/navigation-menu-oob-panel" hx-swap="none">Add the panel</button>

    <!-- 4. Server re-render, now open -->
    <section id="rerender-region"></section>
    <button type="button" id="load-open" hx-get="/fragments/navigation-menu-oob-open" hx-swap="none">Open it</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/navigation-menu-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/navigation-menu-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/navigation-menu-htmx.ts"></script>
  </body>
</html>
