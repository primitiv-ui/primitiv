<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Radio Card, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-group" hx-get="/fragments/radio-card" hx-target="#slot-1">Load group</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A group swapped into another -->
    <section id="outer-region"></section>
    <button type="button" id="load-nested" hx-get="/fragments/radio-card-nested" hx-target="#outer-slot">Load nested</button>

    <!-- 3. An out-of-band card -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/radio-card-oob-item" hx-swap="none">Add a card</button>

    <!-- 4. Server re-render with a new value -->
    <section id="rerender-region"></section>
    <button type="button" id="load-value" hx-get="/fragments/radio-card-oob-value" hx-swap="none">Select team</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/radio-card-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/radio-card-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <!-- 8. Right to left -->
    <button type="button" id="load-rtl" hx-get="/fragments/radio-card-rtl" hx-target="#rtl-slot">Load RTL group</button>
    <div id="rtl-slot"></div>

    <script type="module" src="/src/radio-card-htmx.ts"></script>
  </body>
</html>
