<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><link rel="icon" href="data:," /><title>Interop lab — Stepper, HTMX</title></head>
  <body hx-history-elt>
    <!-- 1. Full fragment swap -->
    <section>
      <button type="button" id="load-stepper" hx-get="/fragments/stepper" hx-target="#slot-1">Load stepper</button>
      <div id="slot-1"></div>
    </section>

    <!-- 2. A stepper swapped into a step's panel of another -->
    <section id="outer-region"></section>
    <button type="button" id="load-nested" hx-get="/fragments/stepper-nested" hx-target="#outer-panel">Load nested</button>

    <!-- 3. A step and its panel arriving out of band -->
    <section id="oob-region"></section>
    <button type="button" id="load-oob" hx-get="/fragments/stepper-oob-step" hx-swap="none">Add a step</button>

    <!-- 4. Server re-render, a step on and the last one complete -->
    <section id="rerender-region"></section>
    <button type="button" id="load-next" hx-get="/fragments/stepper-oob-next" hx-swap="none">Next step</button>

    <!-- 5. hx-preserve -->
    <div id="preserve-region"></div>
    <button type="button" id="swap-preserve" hx-get="/fragments/stepper-preserve" hx-target="#preserve-region" hx-swap="outerHTML">Swap region</button>

    <!-- 6. History -->
    <section id="history-region"></section>
    <a id="go-two" href="/page-two" hx-get="/fragments/page-two" hx-target="#history-target" hx-push-url="/stepper-page-two">Go to page two</a>
    <div id="history-target"></div>

    <!-- 7. Lazy panel -->
    <section id="lazy-region"></section>

    <!-- 8. hx-trigger on the change event, and a veto -->
    <section id="echo-region"></section>
    <div id="echo-target"></div>

    <script type="module" src="/src/stepper-htmx.ts"></script>
  </body>
</html>
