[package]
name = "primitiv-emit-wasm"
version = "0.1.34"
edition = "2021"
# wasm-pack maps these into the generated package.json; `repository.url` is what
# npm's --provenance check cross-references against the Actions OIDC claim, and a
# missing field publishes it as "" (which is what broke harmoni-wasm's first
# publish — see that crate's Cargo.toml).
repository = "https://github.com/primitiv-ui/primitiv.git"
license = "MIT"
description = "Public wasm-pack build of primitiv-emit, the Primitiv token emitter."

[lib]
crate-type = ["cdylib"]

[dependencies]
primitiv-emit = { path = "../primitiv-emit" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Same reason as harmoni-wasm: the wasm-opt bundled with
# jetli/wasm-pack-action@v0.4.0 predates multi-table wasm and cannot parse the
# binary. Optimise at the bundler level instead.
wasm-opt = false
