<primitiv-accordion value="one" class="primitiv-accordion primitiv-accordion--md">
  <primitiv-accordion-item value="one" class="primitiv-accordion__item">
    <h3 class="primitiv-accordion__header">
      <primitiv-accordion-trigger>
        <button type="button" class="primitiv-accordion__trigger">
          <span class="primitiv-accordion__trigger-label">One</span>
          <primitiv-accordion-trigger-icon class="primitiv-accordion__trigger-icon" data-state="open"><!-- Insert your SVG icon here: chevron-down --></primitiv-accordion-trigger-icon>
        </button>
      </primitiv-accordion-trigger>
    </h3>
    <primitiv-accordion-content class="primitiv-accordion__content" data-state="open">
      <span class="primitiv-accordion__content-inner"><span class="primitiv-accordion__content-body">First panel</span></span>
    </primitiv-accordion-content>
  </primitiv-accordion-item>

    </h3>
    <primitiv-accordion-content class="primitiv-accordion__content" hidden>
      <span class="primitiv-accordion__content-inner"><span class="primitiv-accordion__content-body">Second panel</span></span>
    </primitiv-accordion-content>
  </primitiv-accordion-item>
