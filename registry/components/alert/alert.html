<div class="primitiv-alert primitiv-alert--success primitiv-alert--md" role="alert">
  <span class="primitiv-alert__icon-wrapper"><!-- Insert your SVG icon here: success --></span>
  <div class="primitiv-alert__content">
    <div class="primitiv-alert__title">Changes saved</div>
    <div class="primitiv-alert__description">Your profile is up to date.</div>
  </div>
  <button type="button" class="primitiv-alert__dismiss primitiv-button primitiv-button--ghost primitiv-button--md" aria-label="Dismiss" onclick="this.closest('.primitiv-alert').remove()"><!-- Insert your SVG icon here: close --></button>
</div>
