<primitiv-carousel aria-label="Featured" class="primitiv-carousel">
  <primitiv-carousel-viewport class="primitiv-carousel__viewport">
    <primitiv-carousel-slide class="primitiv-carousel__slide">First slide</primitiv-carousel-slide>
    <primitiv-carousel-slide class="primitiv-carousel__slide">Second slide</primitiv-carousel-slide>
    <primitiv-carousel-slide class="primitiv-carousel__slide">Third slide</primitiv-carousel-slide>
  </primitiv-carousel-viewport>
  <primitiv-carousel-previous-trigger>
    <button type="button" class="primitiv-carousel__prev" aria-label="Previous slide"><!-- Insert your SVG icon here: chevron-left --></button>
  </primitiv-carousel-previous-trigger>
  <primitiv-carousel-next-trigger>
    <button type="button" class="primitiv-carousel__next" aria-label="Next slide"><!-- Insert your SVG icon here: chevron-right --></button>
  </primitiv-carousel-next-trigger>
  <primitiv-carousel-indicators label="Choose slide" class="primitiv-carousel__indicator-group">
    <template><button type="button" class="primitiv-carousel__indicator"></button></template>
  </primitiv-carousel-indicators>
</primitiv-carousel>
