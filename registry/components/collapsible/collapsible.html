<primitiv-collapsible class="primitiv-collapsible primitiv-collapsible--card primitiv-collapsible--md">

    <button type="button" class="primitiv-collapsible__trigger">
      <span class="primitiv-collapsible__trigger-label">Show shipping details</span>
      <primitiv-collapsible-trigger-icon class="primitiv-collapsible__trigger-icon"><!-- Insert your SVG icon here: chevron-down --></primitiv-collapsible-trigger-icon>
