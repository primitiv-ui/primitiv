<primitiv-combobox name="framework" class="primitiv-combobox primitiv-combobox--md">
  <span class="primitiv-combobox__control">
    <primitiv-combobox-input>
      <input class="primitiv-combobox__input" aria-label="Framework" placeholder="Search frameworks..." autocomplete="off">
    </primitiv-combobox-input>
    <span class="primitiv-combobox__icon" aria-hidden="true"><!-- Insert your SVG icon here: chevron-down --></span>
  </span>
  <primitiv-combobox-content popover="auto" aria-label="Frameworks" class="primitiv-combobox__content">
    <primitiv-combobox-item value="react" class="primitiv-combobox__item">
      <span class="primitiv-combobox__item-indicator" aria-hidden="true"><!-- Insert your SVG icon here: check --></span>
      <span class="primitiv-combobox__item-label">React</span>
    </primitiv-combobox-item>
    <primitiv-combobox-item value="preact" class="primitiv-combobox__item">
      <span class="primitiv-combobox__item-indicator" aria-hidden="true"><!-- Insert your SVG icon here: check --></span>
      <span class="primitiv-combobox__item-label">Preact</span>
    </primitiv-combobox-item>
    <primitiv-combobox-item value="svelte" class="primitiv-combobox__item">
      <span class="primitiv-combobox__item-indicator" aria-hidden="true"><!-- Insert your SVG icon here: check --></span>
      <span class="primitiv-combobox__item-label">Svelte</span>
    </primitiv-combobox-item>
    <primitiv-combobox-item value="vue" class="primitiv-combobox__item">
      <span class="primitiv-combobox__item-indicator" aria-hidden="true"><!-- Insert your SVG icon here: check --></span>
      <span class="primitiv-combobox__item-label">Vue</span>
    </primitiv-combobox-item>
    <primitiv-combobox-empty class="primitiv-combobox__empty">No matches</primitiv-combobox-empty>
  </primitiv-combobox-content>
</primitiv-combobox>
