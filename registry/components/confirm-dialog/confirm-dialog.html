<primitiv-modal>
  <primitiv-modal-trigger>
    <button type="button" class="primitiv-button primitiv-button--danger primitiv-button--md"><span class="primitiv-button__label">Remove member</span></button>
  </primitiv-modal-trigger>
  <primitiv-modal-content>
    <dialog class="primitiv-modal primitiv-modal--sm primitiv-confirm-dialog">
      <span class="primitiv-modal__header">
        <primitiv-modal-title><h2 class="primitiv-modal__title">Remove member?</h2></primitiv-modal-title>
      </span>
      <span class="primitiv-modal__body">
        <primitiv-modal-description><p class="primitiv-modal__description">They will lose access immediately. This can't be undone.</p></primitiv-modal-description>
      </span>
      <span class="primitiv-modal__footer">
        <primitiv-modal-close>
          <button type="button" class="primitiv-button primitiv-button--secondary primitiv-button--sm"><span class="primitiv-button__label">Cancel</span></button>
        </primitiv-modal-close>
        <button type="button" class="primitiv-button primitiv-button--danger primitiv-button--sm" data-confirm><span class="primitiv-button__label">Remove</span></button>
      </span>
    </dialog>
  </primitiv-modal-content>
</primitiv-modal>
