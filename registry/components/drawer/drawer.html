<primitiv-modal>
  <primitiv-modal-trigger>
    <!-- Your own button: style it yourself, or as a Button (primitiv add button). -->
    <button type="button" class="primitiv-button primitiv-button--secondary primitiv-button--md"><span class="primitiv-button__label">Open settings</span></button>
  </primitiv-modal-trigger>
  <primitiv-modal-content>
    <dialog class="primitiv-drawer primitiv-drawer--md" data-side="right">
      <span class="primitiv-drawer__header">
        <primitiv-modal-title><h2 class="primitiv-drawer__title">Settings</h2></primitiv-modal-title>
        <primitiv-modal-close>
          <button type="button" class="primitiv-drawer__close" aria-label="Close"><!-- Insert your SVG icon here: close --></button>
        </primitiv-modal-close>
      </span>
      <span class="primitiv-drawer__body">
        <primitiv-modal-description><p class="primitiv-drawer__description">Changes apply as soon as you make them.</p></primitiv-modal-description>
      </span>
      <span class="primitiv-drawer__footer">
        <primitiv-modal-close>
          <button type="button" class="primitiv-drawer__close">Done</button>
        </primitiv-modal-close>
      </span>
    </dialog>
  </primitiv-modal-content>
</primitiv-modal>
