<div class="primitiv-field primitiv-field--md">
  <label class="primitiv-field__label" for="email">Email</label>
  <!-- Field lays out its parts and leaves the control to you: style it yourself, or as an Input (primitiv add input). -->
  <input type="email" class="primitiv-input primitiv-input--md" id="email" name="email" required aria-invalid="true" aria-describedby="email-description email-error">
  <div class="primitiv-field__description" id="email-description">We only use it to send your receipt.</div>
  <div class="primitiv-field__error" id="email-error" role="alert">Enter an email address, like name@example.com.</div>
</div>
