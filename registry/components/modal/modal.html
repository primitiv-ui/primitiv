<primitiv-modal>
  <primitiv-modal-trigger>
    <button type="button">Edit profile</button>
  </primitiv-modal-trigger>
  <primitiv-modal-content>
    <dialog class="primitiv-modal primitiv-modal--md">
      <span class="primitiv-modal__header">
        <primitiv-modal-title><h2 class="primitiv-modal__title">Edit profile</h2></primitiv-modal-title>
        <primitiv-modal-close>
          <button type="button" class="primitiv-modal__close" aria-label="Close"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M20.06 19 19 20.06 3.94 5 5 3.94z"/><path d="M20.06 5 5 20.06 3.94 19 19 3.94z"/></svg></button>
        </primitiv-modal-close>
      </span>
      <span class="primitiv-modal__body">
        <primitiv-modal-description><p class="primitiv-modal__description">Changes are saved to your account when you close this dialog.</p></primitiv-modal-description>
      </span>
      <span class="primitiv-modal__footer">
        <primitiv-modal-close>
          <button type="button" class="primitiv-modal__close">Done</button>
        </primitiv-modal-close>
      </span>
    </dialog>
  </primitiv-modal-content>
</primitiv-modal>
