<primitiv-popover>
  <primitiv-popover-trigger>
    <!-- Your own button. To style it as a Button, run primitiv add button and give it the classes primitiv-button primitiv-button--secondary primitiv-button--md. -->
    <button type="button">Edit profile</button>
  </primitiv-popover-trigger>
  <primitiv-popover-content class="primitiv-popover primitiv-popover--md primitiv-popover--bottom" popover="auto">
    <primitiv-popover-title><h2 class="primitiv-popover__title">Profile</h2></primitiv-popover-title>
    <primitiv-popover-description><p class="primitiv-popover__description">Your display name is shown on every comment.</p></primitiv-popover-description>
    <primitiv-popover-close>
      <button type="button" class="primitiv-popover__close" aria-label="Close"><!-- Insert your SVG icon here: close --></button>
    </primitiv-popover-close>
  </primitiv-popover-content>
</primitiv-popover>
