<primitiv-toggle-group type="multiple" value="bold" aria-label="Formatting" class="primitiv-toggle-group primitiv-toggle-group--md">
  <primitiv-toggle-group-item value="bold">
    <button type="button" class="primitiv-toggle-group__item">
      <span class="primitiv-toggle-group__item-label">Bold</span>
    </button>
  </primitiv-toggle-group-item>
  <primitiv-toggle-group-item value="italic">
    <button type="button" class="primitiv-toggle-group__item">
      <span class="primitiv-toggle-group__item-label">Italic</span>
    </button>
  </primitiv-toggle-group-item>
  <primitiv-toggle-group-item value="underline">
    <button type="button" class="primitiv-toggle-group__item">
      <span class="primitiv-toggle-group__item-label">Underline</span>
    </button>
  </primitiv-toggle-group-item>
</primitiv-toggle-group>
